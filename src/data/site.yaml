    period: "Jan 2026 – Oct 2026"
    role: "Permanent Formwork Installer"
    text: "Installed permanent formwork wall systems, including Dincel, AFS and Ritek."

# Shown in the "Next" block. Set `show: false` to hide it.
tafe:
