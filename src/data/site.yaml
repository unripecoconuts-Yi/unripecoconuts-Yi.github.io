# Formwork skills that carry over to carpentry (shown in the "What carries over" section)
scope:
  - title: "Read the drawings, set out"
    text: "Work from the drawings to set out walls, openings and corners before anything goes up."
  - title: "Plumb, level and brace"
    text: "Stand wall panels, line them up with a laser level and brace them so they stay put."
  - title: "Cut to size"
    text: "Measure and cut panels on site with power tools so they fit first time."
  - title: "Come back and finish"
    text: "Return once the concrete has cured to fix, patch and finish the walls to spec."

# Where you've worked (shown just above the "Next" block). Add another `- company:` entry for each job.
experience:
